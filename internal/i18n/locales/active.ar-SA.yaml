opensheet.tutorial.step1: "أنشئ جدول بيانات Google بثلاث علامات تبويب، والصق كل صف عناوين في الصف 1 من علامة تبويبه. ينتهي كل صف عناوين بـ deleted_at، ويملؤه OpenSheet عند حذف صف."
