opensheet.tutorial.title: "Set up"
opensheet.tutorial.step1: "Create a Google Sheet with three tabs, and paste each header row into row 1 of its tab. Every header row ends with deleted_at, which opensheet fills in when a row is deleted."
opensheet.tutorial.step2: "In opensheet, publish each tab with the slug below, set id as its id column, and mark it writable."
opensheet.tutorial.step3: "Mint an opensheet API key with sheets:read and sheets:write, granted to those three sheets."
