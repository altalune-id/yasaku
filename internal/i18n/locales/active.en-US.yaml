webhooks.guide_heading: "How to integrate"
webhooks.guide_intro: "Connect a receiver in a few minutes. Every delivery is a signed JSON POST to your URL."
webhooks.guide_step_url: "Click New endpoint and enter the https:// URL that will receive events."
webhooks.guide_step_events: "Pick the events to subscribe to, then save."
webhooks.guide_step_secret: "Copy the signing secret. It is shown only once, so store it where your receiver can read it."
webhooks.guide_step_verify: "Verify the signature of every request. The endpoint page has ready-to-copy code for Go, Node.js and Python."
webhooks.guide_step_test: "On the endpoint page, click Send test to deliver a ping event."
webhooks.guide_step_inspect: "Under Recent deliveries, click Details to see the exact payload, its headers and every attempt."
webhooks.guide_step_retry: "Fix your receiver, then retry a failed delivery, or retry all failed ones at once."
webhooks.guide_receiver_heading: "Receiver checklist"
webhooks.guide_respond: "Answer with a 2xx status fast, then do the work. Any other status, a redirect or a timeout counts as a failure."
webhooks.guide_dedupe: "A delivery can arrive more than once. Deduplicate on this header; retries keep its value:"
webhooks.guide_correlate: "Every endpoint that receives the same event gets the same value in:"
webhooks.guide_retries: "Failed deliveries retry on their own, up to {{.Attempts}} attempts over about {{.TotalHours}} hours: the first wait is {{.FirstSeconds}} seconds, the longest {{.LongestHours}} hours."
webhooks.verify_heading: "Verify signatures"
webhooks.verify_intro: "Compute HMAC-SHA256 over the timestamp, a dot and the raw request body, keyed with the whole signing secret, whsec_ prefix included. Compare the lowercase hex, prefixed v1=, in constant time with each value in the signature header, and reject a timestamp more than 5 minutes from your clock."
webhooks.verify_headers_label: "Headers to read:"
webhooks.verify_env: "The examples read the secret from YASAKU_WEBHOOK_SECRET and sign the body exactly as received, before any JSON parsing."
webhooks.verify_copy: "Copy code"
webhooks.verify_copy_label: "Copy the {{.Lang}} example"
webhooks.verify_languages: "Example language"
