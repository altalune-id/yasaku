syntax = "proto3";

package yasakutest.v1;

import "yasaku/mcp/v1/annotations.proto";

option go_package = "altalune.id/yasaku/cmd/protoc-gen-yasaku-mcp/internal/gen/testdata/gen/yasakutest/v1;yasakutestv1";

service BadAccessService {
  rpc NoAccess(BadAccessRequest) returns (BadAccessResponse) {
    option (yasaku.mcp.v1.tool) = {name: "no_access"};
  }
}

message BadAccessRequest {}

message BadAccessResponse {}
