syntax = "proto3";

package yasakutest.v1;

import "yasaku/mcp/v1/annotations.proto";

option go_package = "altalune.id/yasaku/cmd/protoc-gen-yasaku-mcp/internal/gen/testdata/gen/yasakutest/v1;yasakutestv1";

service BadConfirmService {
  rpc MutateWithoutConfirm(BadConfirmRequest) returns (BadConfirmResponse) {
    option (yasaku.mcp.v1.tool) = {
      access: ACCESS_WRITE
      mutation: true
    };
  }
}

message BadConfirmRequest {
  string confirm = 1;
}

message BadConfirmResponse {}
