syntax = "proto3";

package yasakutest.v1;

import "google/protobuf/timestamp.proto";
import "yasaku/mcp/v1/annotations.proto";

option go_package = "altalune.id/yasaku/cmd/protoc-gen-yasaku-mcp/internal/gen/testdata/gen/yasakutest/v1;yasakutestv1";

// FixtureService exercises every schema shape the generator has to render.
service FixtureService {
  // Ping echoes the target back and reports the server clock.
  rpc Ping(PingRequest) returns (PingResponse) {
    option (yasaku.mcp.v1.tool) = {
      access: ACCESS_READ
      ui: "app"
    };
  }
  rpc Poke(PokeRequest) returns (PokeResponse) {
    option (yasaku.mcp.v1.tool) = {
      name: "poke_target"
      description: "Poke the target once."
      access: ACCESS_WRITE
      mutation: true
    };
  }
  rpc Untouched(PingRequest) returns (PingResponse);
}

// Target names the org and project a request acts on.
message Target {
  // Org is the organisation slug.
  string org = 1;
  string project = 2;
}

// Kind is the flavour of ping to send.
enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_FAST = 1;
  KIND_SLOW = 2;
}

// Node is self-referential so the schema builder has to break the cycle.
message Node {
  string id = 1;
  Node child = 2;
  repeated Node siblings = 3;
}

message PingRequest {
  Target target = 1;
  // Echo is the text sent back verbatim.
  string echo = 2;
  int64 big = 3;
  uint32 small = 4;
  double ratio = 5;
  bool loud = 6;
  bytes blob = 7;
  repeated string tags = 8;
  map<string, string> labels = 9;
  map<string, Target> scoped = 10;
  Kind kind = 11;
  google.protobuf.Timestamp at = 12;
  Node node = 13;
  optional string note = 14;
}

message PingResponse {
  string echo = 1;
}

message PokeRequest {
  Target target = 1;
  bool confirm = 2;
}

message PokeResponse {
  string result = 1;
}
