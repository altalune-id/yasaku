syntax = "proto3";

package yasakutest.v1;

import "yasaku/mcp/v1/annotations.proto";

option go_package = "altalune.id/yasaku/cmd/protoc-gen-yasaku-mcp/internal/gen/testdata/gen/yasakutest/v1;yasakutestv1";

service BadEchoService {
  rpc EchoTwice(BadEchoRequest) returns (BadEchoResponse) {
    option (yasaku.mcp.v1.tool) = {
      name: "poke_target"
      access: ACCESS_READ
    };
  }
}

message BadEchoRequest {}

message BadEchoResponse {}
