openapi: 3.1.0
info:
  title: yasaku.v1
paths:
  /yasaku.v1.ReportService/CashflowReport:
    post:
      tags:
        - yasaku.v1.ReportService
      summary: CashflowReport
      operationId: yasaku.v1.ReportService.CashflowReport
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/yasaku.v1.CashflowReportRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/yasaku.v1.CashflowReportResponse'
  /yasaku.v1.ReportService/PeriodReport:
    post:
      tags:
        - yasaku.v1.ReportService
      summary: PeriodReport
      operationId: yasaku.v1.ReportService.PeriodReport
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/yasaku.v1.PeriodReportRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/yasaku.v1.PeriodReportResponse'
components:
  schemas:
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A proto3 JSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a proto3 JSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    yasaku.v1.CashflowPoint:
      type: object
      properties:
        period:
          title: period
          $ref: '#/components/schemas/yasaku.v1.Period'
        income:
          title: income
          $ref: '#/components/schemas/yasaku.v1.Money'
        expense:
          title: expense
          $ref: '#/components/schemas/yasaku.v1.Money'
        net:
          title: net
          $ref: '#/components/schemas/yasaku.v1.Money'
      title: CashflowPoint
      additionalProperties: false
      description: CashflowPoint is one period's income, expense and net.
    yasaku.v1.CashflowReportRequest:
      type: object
      properties:
        target:
          title: target
          $ref: '#/components/schemas/yasaku.v1.Target'
        periods:
          type: integer
          title: periods
          format: int32
          description: How many of the most recent periods to plot. Defaults to 6, capped at 24.
      title: CashflowReportRequest
      additionalProperties: false
    yasaku.v1.CashflowReportResponse:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/yasaku.v1.CashflowPoint'
          title: points
      title: CashflowReportResponse
      additionalProperties: false
    yasaku.v1.CategoryRef:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        icon:
          type: string
          title: icon
        color:
          type: string
          title: color
      title: CategoryRef
      additionalProperties: false
      description: CategoryRef names a category inside a report slice; an empty id is the uncategorized slice.
    yasaku.v1.CategorySlice:
      type: object
      properties:
        category:
          title: category
          $ref: '#/components/schemas/yasaku.v1.CategoryRef'
        amount:
          title: amount
          $ref: '#/components/schemas/yasaku.v1.Money'
        share:
          type: number
          title: share
          format: double
        count:
          type: integer
          title: count
          format: int32
      title: CategorySlice
      additionalProperties: false
      description: CategorySlice is one category's share of a period's spend or income; an empty category id is the uncategorized slice.
    yasaku.v1.Money:
      type: object
      properties:
        amount:
          type: string
          title: amount
        currency:
          type: string
          title: currency
      title: Money
      additionalProperties: false
      description: Money is a major-unit decimal string plus its ISO 4217 code, e.g. amount "40000" currency "IDR".
    yasaku.v1.Period:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        startDate:
          type: string
          title: start_date
        endDate:
          type: string
          title: end_date
        status:
          type: string
          title: status
          description: One of open or closed.
        closedAt:
          title: closed_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        snapshot:
          title: snapshot
          $ref: '#/components/schemas/yasaku.v1.Snapshot'
      title: Period
      additionalProperties: false
      description: Period is one budget cycle; the current period is the one with an empty end_date.
    yasaku.v1.PeriodReportRequest:
      type: object
      properties:
        target:
          title: target
          $ref: '#/components/schemas/yasaku.v1.Target'
        period:
          type: string
          title: period
          description: Period ID from list_periods or current_period, never a period name. Empty means the current period.
      title: PeriodReportRequest
      additionalProperties: false
    yasaku.v1.PeriodReportResponse:
      type: object
      properties:
        period:
          title: period
          $ref: '#/components/schemas/yasaku.v1.Period'
        income:
          title: income
          $ref: '#/components/schemas/yasaku.v1.Money'
        expense:
          title: expense
          $ref: '#/components/schemas/yasaku.v1.Money'
        net:
          title: net
          $ref: '#/components/schemas/yasaku.v1.Money'
        txCount:
          type: integer
          title: tx_count
          format: int32
        spendByCategory:
          type: array
          items:
            $ref: '#/components/schemas/yasaku.v1.CategorySlice'
          title: spend_by_category
        incomeByCategory:
          type: array
          items:
            $ref: '#/components/schemas/yasaku.v1.CategorySlice'
          title: income_by_category
        wallets:
          type: array
          items:
            $ref: '#/components/schemas/yasaku.v1.WalletLine'
          title: wallets
      title: PeriodReportResponse
      additionalProperties: false
    yasaku.v1.Snapshot:
      type: object
      properties:
        income:
          title: income
          $ref: '#/components/schemas/yasaku.v1.Money'
        expense:
          title: expense
          $ref: '#/components/schemas/yasaku.v1.Money'
        net:
          title: net
          $ref: '#/components/schemas/yasaku.v1.Money'
        txCount:
          type: integer
          title: tx_count
          format: int32
        wallets:
          type: array
          items:
            $ref: '#/components/schemas/yasaku.v1.WalletClosing'
          title: wallets
        computedAt:
          title: computed_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Snapshot
      additionalProperties: false
      description: Snapshot is a period's totals, frozen on close or computed live for the current period.
    yasaku.v1.Target:
      type: object
      properties:
        org:
          type: string
          title: org
        project:
          type: string
          title: project
      title: Target
      additionalProperties: false
      description: Target names the org and project a request acts on; both empty means the caller's only project.
    yasaku.v1.WalletClosing:
      type: object
      properties:
        wallet:
          title: wallet
          $ref: '#/components/schemas/yasaku.v1.WalletRef'
        closing:
          title: closing
          $ref: '#/components/schemas/yasaku.v1.Money'
      title: WalletClosing
      additionalProperties: false
      description: WalletClosing is one wallet's balance at the moment the snapshot was taken.
    yasaku.v1.WalletLine:
      type: object
      properties:
        wallet:
          title: wallet
          $ref: '#/components/schemas/yasaku.v1.WalletRef'
        kind:
          type: string
          title: kind
        excludeFromTotal:
          type: boolean
          title: exclude_from_total
        opening:
          title: opening
          $ref: '#/components/schemas/yasaku.v1.Money'
        in:
          title: in
          $ref: '#/components/schemas/yasaku.v1.Money'
        out:
          title: out
          $ref: '#/components/schemas/yasaku.v1.Money'
        closing:
          title: closing
          $ref: '#/components/schemas/yasaku.v1.Money'
      title: WalletLine
      additionalProperties: false
      description: WalletLine is one wallet's movement across a period, or its live balance when the report is not period-keyed.
    yasaku.v1.WalletRef:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
      title: WalletRef
      additionalProperties: false
      description: WalletRef names a wallet inside another record without repeating its row.
security: []
tags:
  - name: yasaku.v1.ReportService
    description: ReportService is the read-only reporting surface over a project's transactions.
