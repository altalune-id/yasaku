openapi: 3.1.0
info:
  title: yasaku.v1
paths:
  /yasaku.v1.LedgerService/GetSettings:
    post:
      tags:
        - yasaku.v1.LedgerService
      summary: GetSettings
      operationId: yasaku.v1.LedgerService.GetSettings
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/yasaku.v1.GetSettingsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/yasaku.v1.GetSettingsResponse'
  /yasaku.v1.LedgerService/UpdateSettings:
    post:
      tags:
        - yasaku.v1.LedgerService
      summary: UpdateSettings
      operationId: yasaku.v1.LedgerService.UpdateSettings
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/yasaku.v1.UpdateSettingsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/yasaku.v1.UpdateSettingsResponse'
components:
  schemas:
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          oneOf:
            - type: object
              title: Any
              additionalProperties: true
              description: Detailed error information.
          discriminator:
            propertyName: type
          title: Debug
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    yasaku.v1.GetSettingsRequest:
      type: object
      properties:
        target:
          title: target
          $ref: '#/components/schemas/yasaku.v1.Target'
      title: GetSettingsRequest
      additionalProperties: false
    yasaku.v1.GetSettingsResponse:
      type: object
      properties:
        settings:
          title: settings
          $ref: '#/components/schemas/yasaku.v1.Settings'
      title: GetSettingsResponse
      additionalProperties: false
    yasaku.v1.Settings:
      type: object
      properties:
        timezone:
          type: string
          title: timezone
        currency:
          type: string
          title: currency
        periodStartDay:
          type: integer
          title: period_start_day
          format: int32
      title: Settings
      additionalProperties: false
      description: Settings is a project's ledger configuration; a project that was never configured reads back the defaults.
    yasaku.v1.Target:
      type: object
      properties:
        org:
          type: string
          title: org
        project:
          type: string
          title: project
      title: Target
      additionalProperties: false
      description: Target names the org and project a request acts on; both empty means the caller's only project.
    yasaku.v1.UpdateSettingsRequest:
      type: object
      properties:
        target:
          title: target
          $ref: '#/components/schemas/yasaku.v1.Target'
        timezone:
          type:
            - string
            - "null"
          title: timezone
        currency:
          type:
            - string
            - "null"
          title: currency
        periodStartDay:
          type:
            - integer
            - "null"
          title: period_start_day
          format: int32
      title: UpdateSettingsRequest
      additionalProperties: false
    yasaku.v1.UpdateSettingsResponse:
      type: object
      properties:
        settings:
          title: settings
          $ref: '#/components/schemas/yasaku.v1.Settings'
      title: UpdateSettingsResponse
      additionalProperties: false
security: []
tags:
  - name: yasaku.v1.LedgerService
    description: LedgerService reads and writes one project's ledger settings.
