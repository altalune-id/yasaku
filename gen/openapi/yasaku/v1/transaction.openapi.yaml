        period:
          type: string
          title: period
          description: Period ID from list_periods or current_period, never a period name. Empty means the period containing occurred_at.
        confirm:
          type: boolean
          title: confirm
      title: RecordIncomeRequest
      additionalProperties: false
      description: RecordIncomeRequest addresses wallet and category by name or id; occurred_at is RFC3339 or YYYY-MM-DD and defaults to now.
    yasaku.v1.RecordIncomeResponse:
      type: object
