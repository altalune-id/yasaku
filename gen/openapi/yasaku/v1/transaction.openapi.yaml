          description: Period ID from list_periods or current_period, never a period name. Empty means the period containing occurred_at.
        confirm:
          type: boolean
          title: confirm
      title: RecordTransferRequest
      additionalProperties: false
      description: RecordTransferRequest addresses both wallets by name or id; occurred_at is RFC3339 or YYYY-MM-DD and defaults to now.
    yasaku.v1.RecordTransferResponse:
      type: object
      properties:
        needs:
          title: needs
          $ref: '#/components/schemas/yasaku.v1.Needs'
        preview:
          title: preview
          description: 'The transfer as it would be saved: both wallets, amount, period and occurred_at are resolved; id and created_at are empty.'
          $ref: '#/components/schemas/yasaku.v1.Transaction'
        result:
          title: result
          $ref: '#/components/schemas/yasaku.v1.Transaction'
        warning:
          type: string
          title: warning
      title: RecordTransferResponse
      additionalProperties: false
    yasaku.v1.ReviseTransactionRequest:
      type: object
      properties:
        target:
          title: target
          $ref: '#/components/schemas/yasaku.v1.Target'
        id:
          type: string
          title: id
        wallet:
          type:
            - string
            - "null"
          title: wallet
        toWallet:
          type:
            - string
            - "null"
          title: to_wallet
        amount:
          title: amount
          $ref: '#/components/schemas/yasaku.v1.Money'
        category:
          type:
            - string
            - "null"
          title: category
        note:
          type:
            - string
            - "null"
          title: note
        occurredAt:
          type:
            - string
            - "null"
          title: occurred_at
        period:
          type:
            - string
            - "null"
          title: period
          description: Period ID from list_periods or current_period, never a period name. Absent leaves the period alone; it is re-derived when occurred_at moves.
        confirm:
          type: boolean
          title: confirm
      title: ReviseTransactionRequest
      additionalProperties: false
      description: ReviseTransactionRequest leaves every absent field unchanged; an empty category clears it.
    yasaku.v1.ReviseTransactionResponse:
      type: object
      properties:
        needs:
          title: needs
          $ref: '#/components/schemas/yasaku.v1.Needs'
        preview:
          title: preview
          description: 'The stored transaction with the requested changes applied: id and created_at are the stored ones, every other field is the resolved intent.'
          $ref: '#/components/schemas/yasaku.v1.Transaction'
        result:
          title: result
          $ref: '#/components/schemas/yasaku.v1.Transaction'
        warning:
          type: string
          title: warning
      title: ReviseTransactionResponse
      additionalProperties: false
    yasaku.v1.SearchTransactionsRequest:
      type: object
      properties:
        target:
          title: target
          $ref: '#/components/schemas/yasaku.v1.Target'
        query:
          type: string
          title: query
        from:
          type: string
          title: from
        to:
          type: string
          title: to
        limit:
          type: integer
          title: limit
          format: int32
          description: Defaults to 50, capped at 200.
        cursor:
          type: string
          title: cursor
      title: SearchTransactionsRequest
      additionalProperties: false
    yasaku.v1.SearchTransactionsResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/yasaku.v1.Transaction'
          title: transactions
        nextCursor:
          type: string
          title: next_cursor
        totalIn:
          title: total_in
          $ref: '#/components/schemas/yasaku.v1.Money'
        totalOut:
          title: total_out
          $ref: '#/components/schemas/yasaku.v1.Money'
      title: SearchTransactionsResponse
      additionalProperties: false
      description: SearchTransactionsResponse totals only the rows on this page, and only when they share one currency.
    yasaku.v1.SuggestCategoryRequest:
      type: object
      properties:
        target:
          title: target
          $ref: '#/components/schemas/yasaku.v1.Target'
        note:
          type: string
          title: note
      title: SuggestCategoryRequest
      additionalProperties: false
    yasaku.v1.SuggestCategoryResponse:
      type: object
      properties:
        category:
          title: category
          $ref: '#/components/schemas/yasaku.v1.Category'
        found:
          type: boolean
          title: found
      title: SuggestCategoryResponse
      additionalProperties: false
    yasaku.v1.Target:
      type: object
      properties:
        org:
          type: string
          title: org
        project:
          type: string
          title: project
      title: Target
      additionalProperties: false
      description: Target names the org and project a request acts on; both empty means the caller's only project.
    yasaku.v1.Transaction:
      type: object
      properties:
        id:
          type: string
          title: id
        kind:
          type: string
          title: kind
          description: One of income, expense, transfer, opening, adjustment_in, adjustment_out. The last three are written by the system and never accepted on a write.
        wallet:
          title: wallet
          $ref: '#/components/schemas/yasaku.v1.WalletRef'
        toWallet:
          title: to_wallet
          $ref: '#/components/schemas/yasaku.v1.WalletRef'
        amount:
          title: amount
          $ref: '#/components/schemas/yasaku.v1.Money'
        category:
          title: category
          $ref: '#/components/schemas/yasaku.v1.Category'
        periodId:
          type: string
          title: period_id
        periodName:
          type: string
          title: period_name
        note:
          type: string
          title: note
        occurredAt:
          title: occurred_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        createdAt:
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Transaction
      additionalProperties: false
      description: Transaction is one movement of money; amount is always positive and the direction comes from kind.
    yasaku.v1.WalletRef:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
      title: WalletRef
      additionalProperties: false
      description: WalletRef names a wallet inside another record without repeating its row.
