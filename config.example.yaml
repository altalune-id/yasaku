# yasaku — auto-generated from internal/platform/config struct tags.
# DO NOT edit by hand. Run `go tool gen-config-example --format=yaml` to regenerate.
#
# Copy to config.yaml, uncomment what you need to set, and pass `-c config.yaml`.
# Every field maps to an env var (shown as `env: YASAKU_*` in the per-field comment).
# Env vars override YAML.
#
# Awareness markers (in [brackets] on the per-field comment):
#   required   — must be non-empty for the app to boot (in the applicable mode)
#   bootstrap  — set once at first-run; changing later has no effect or breaks things
#   secret     — never commit; use env vars or a secret store
#   mode:X     — only applies in the given mode (selfhosted | cloud)

api:
  # env: YASAKU_API_ENABLED
  enabled: true
  openapi:
    # [secret] env: YASAKU_API_OPENAPI_BASIC_AUTH_PASSWORD
    basicAuthPassword: ""
    # env: YASAKU_API_OPENAPI_BASIC_AUTH_USER
    basicAuthUser: ""
    # env: YASAKU_API_OPENAPI_ENABLED
    enabled: true
    # env: YASAKU_API_OPENAPI_REQUIRE_BASIC_AUTH
    requireBasicAuth: true

compliance:
  # env: YASAKU_COMPLIANCE_PRIVACY_URL
  privacyURL: ""
  # env: YASAKU_COMPLIANCE_REQUIRE_ACCEPTANCE
  requireAcceptance: ""
  # env: YASAKU_COMPLIANCE_TERMS_URL
  termsURL: ""

db:
  # [bootstrap] env: YASAKU_DB_ALLOW_BYPASS_RLS
  allowBypassRLS: ""
  # env: YASAKU_DB_AUTO_MIGRATE
  autoMigrate: true
  # env: YASAKU_DB_CONN_MAX_IDLE_TIME
  connMaxIdleTime: ""
  # env: YASAKU_DB_CONN_MAX_LIFETIME
  connMaxLifetime: ""
  # env: YASAKU_DB_CONNECT_BACKOFF
  connectBackoff: 250ms
  # env: YASAKU_DB_CONNECT_TIMEOUT
  connectTimeout: 30s
  # [required, bootstrap] env: YASAKU_DB_DRIVER
  driver: sqlite
  # [required, secret] env: YASAKU_DB_DSN
  dsn: ""
  health:
    # env: YASAKU_DB_HEALTH_INTERVAL
    interval: 30s
    # env: YASAKU_DB_HEALTH_TIMEOUT
    timeout: 2s
  # env: YASAKU_DB_MAX_IDLE_CONNS
  maxIdleConns: ""
  # env: YASAKU_DB_MAX_OPEN_CONNS
  maxOpenConns: ""
  migrator:
    # [secret, bootstrap] env: YASAKU_DB_MIGRATOR_DSN
    dsn: ""
    # [bootstrap] env: YASAKU_DB_MIGRATOR_ROLE
    role: ""
  reader:
    # env: YASAKU_DB_READER_CONN_MAX_IDLE_TIME
    connMaxIdleTime: ""
    # env: YASAKU_DB_READER_CONN_MAX_LIFETIME
    connMaxLifetime: ""
    # [secret] env: YASAKU_DB_READER_DSN
    dsn: ""
    # env: YASAKU_DB_READER_MAX_IDLE_CONNS
    maxIdleConns: ""
    # env: YASAKU_DB_READER_MAX_OPEN_CONNS
    maxOpenConns: ""
    # [bootstrap] env: YASAKU_DB_READER_ROLE
    role: ""
  # [bootstrap] env: YASAKU_DB_ROLE
  role: ""
  # [bootstrap] env: YASAKU_DB_SCHEMA
  schema: public
  # [bootstrap] env: YASAKU_DB_TABLE_PREFIX
  tablePrefix: yasaku_

genesis:
  # [bootstrap, mode:cloud] env: YASAKU_GENESIS_BREAK_GLASS
  breakGlass: false
  # env: YASAKU_GENESIS_EMAIL
  email: ""
  # [bootstrap, secret] env: YASAKU_GENESIS_PASSWORD
  password: ""

http:
  # [required] env: YASAKU_HTTP_ADDR
  addr: ":5150"
  # env: YASAKU_HTTP_BASE_PATH
  basePath: ""
  # [required] env: YASAKU_HTTP_BASE_URL
  baseURL: ""
  # env: YASAKU_HTTP_COOKIE_SECURE
  cookieSecure: false
  # env: YASAKU_HTTP_ROBOTS_TXT
  robotsTxt: ""
  # [required, secret, bootstrap] env: YASAKU_HTTP_STATE_SECRET
  stateSecret: ""

i18n:
  # [required, bootstrap] env: YASAKU_I18N_DEFAULT_LOCALE
  defaultLocale: en-US

log:
  # env: YASAKU_LOG_ADD_SOURCE
  addSource: ""
  # env: YASAKU_LOG_FORMAT
  format: json
  # env: YASAKU_LOG_LEVEL
  level: info
  # [bootstrap] env: YASAKU_LOG_REDACT_PATTERNS
  redactPatterns: ""

mail:
  # env: YASAKU_MAIL_DRIVER
  driver: console
  # env: YASAKU_MAIL_FROM
  from: no-reply@yasaku.local
  resend:
    # [secret] env: YASAKU_MAIL_RESEND_API_KEY
    apiKey: ""
    # env: YASAKU_MAIL_RESEND_ENDPOINT
    endpoint: ""
    # env: YASAKU_MAIL_RESEND_MAX_ATTEMPTS
    maxAttempts: 3
  smtp:
    # env: YASAKU_MAIL_SMTP_HOST
    host: ""
    # [secret] env: YASAKU_MAIL_SMTP_PASS
    pass: ""
    # env: YASAKU_MAIL_SMTP_PORT
    port: 587
    # env: YASAKU_MAIL_SMTP_TLS
    tls: true
    # env: YASAKU_MAIL_SMTP_USER
    user: ""

mcp:
  # [bootstrap] env: YASAKU_MCP_AUDIENCE
  audience: ""
  # env: YASAKU_MCP_AUDIENCE_OVERRIDE
  audienceOverride: ""
  # env: YASAKU_MCP_CHALLENGE_TOKEN
  challengeToken: ""
  # [bootstrap] env: YASAKU_MCP_ENABLED
  enabled: false

# [required, bootstrap] env: YASAKU_MODE
mode: selfhosted

observability:
  reporter:
    # env: YASAKU_OBSERVABILITY_REPORTER_MIN_SEVERITY
    minSeverity: error
    # env: YASAKU_OBSERVABILITY_REPORTER_SINKS
    sinks: ""

oidc:
  # env: YASAKU_OIDC_BUTTON_LABEL
  buttonLabel: ""
  # env: YASAKU_OIDC_BUTTON_LOGO_URL
  buttonLogoURL: ""
  # [required, mode:cloud] env: YASAKU_OIDC_CLIENT_ID
  clientID: ""
  # [required, mode:cloud, secret] env: YASAKU_OIDC_CLIENT_SECRET
  clientSecret: ""
  # env: YASAKU_OIDC_END_SESSION_ON_LOGOUT
  endSessionOnLogout: ""
  # [required, mode:cloud] env: YASAKU_OIDC_ISSUER
  issuer: ""
  # env: YASAKU_OIDC_REDIRECT_PORT
  redirectPort: ""
  # env: YASAKU_OIDC_RESOURCE
  resource: ""
  # env: YASAKU_OIDC_SCOPES
  scopes: openid,email,profile

onboard:
  # [secret] env: YASAKU_ONBOARD_SETUP_TOKEN
  setupToken: ""

scheduler:
  # [bootstrap] env: YASAKU_SCHEDULER_ENABLED
  enabled: true
  # env: YASAKU_SCHEDULER_SHUTDOWN_GRACE
  shutdownGrace: 30s
  # [bootstrap] env: YASAKU_SCHEDULER_TIMEZONE
  timezone: UTC

security:
  # [required, secret, bootstrap] env: YASAKU_SECURITY_ENCRYPTION_KEY
  encryptionKey: ""

session:
  # env: YASAKU_SESSION_PATH
  path: ~/.yasaku/session.json

telemetry:
  metrics:
    # env: YASAKU_TELEMETRY_METRICS_ENABLED
    enabled: false
    # env: YASAKU_TELEMETRY_METRICS_EXPORT_INTERVAL
    exportInterval: 30s
    prometheus:
      # env: YASAKU_TELEMETRY_METRICS_PROMETHEUS_ADDR
      addr: ":9091"
      # env: YASAKU_TELEMETRY_METRICS_PROMETHEUS_ENABLED
      enabled: false
      # env: YASAKU_TELEMETRY_METRICS_PROMETHEUS_PATH
      path: /metrics
  otlp:
    # env: YASAKU_TELEMETRY_OTLP_ENDPOINT
    endpoint: ""
    # [secret] env: YASAKU_TELEMETRY_OTLP_HEADERS
    headers: ""
    # env: YASAKU_TELEMETRY_OTLP_INSECURE
    insecure: ""
    # env: YASAKU_TELEMETRY_OTLP_PROTOCOL
    protocol: ""
  tracing:
    # env: YASAKU_TELEMETRY_TRACING_ENABLED
    enabled: false
    # env: YASAKU_TELEMETRY_TRACING_SAMPLE_RATIO
    sampleRatio: ""

tenant:
  # env: YASAKU_TENANT_PERSONAL_ORG_SLUG_FALLBACK
  personalOrgSlugFallback: personal
  # env: YASAKU_TENANT_PERSONAL_PROJECT_SLUG
  personalProjectSlug: default
  # [bootstrap] env: YASAKU_TENANT_RLS_ENFORCE
  rlsEnforce: true
  singletonOrg:
    # [bootstrap] env: YASAKU_TENANT_SINGLETON_ORG_NAME
    name: Default Organization
    # [bootstrap] env: YASAKU_TENANT_SINGLETON_ORG_SLUG
    slug: default
  # [bootstrap] env: YASAKU_TENANT_TENANT_SCOPED_TABLES
  tenantScopedTables: ""

tokens:
  # env: YASAKU_TOKENS_ACCEPT_RS256
  acceptRS256: ""
  # [required, mode:cloud, bootstrap] env: YASAKU_TOKENS_AUDIENCE
  audience: "urn:yasaku:api"
  # env: YASAKU_TOKENS_CLOCK_SKEW
  clockSkew: 60s
  # [required, mode:cloud] env: YASAKU_TOKENS_ISSUER
  issuer: ""
  # env: YASAKU_TOKENS_JWKS_CACHE_TTL
  jwksCacheTTL: ""
  # [required, mode:cloud] env: YASAKU_TOKENS_JWKS_URL
  jwksURL: ""
  # env: YASAKU_TOKENS_SUPPORTED_ALGS
  supportedAlgs: RS256,ES256
