name: yasaku

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yasaku
      POSTGRES_PASSWORD: yasaku
      POSTGRES_DB: yasaku
    ports:
      - "5432:5432"
    volumes:
      - ./docker/data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yasaku -d yasaku"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI at http://localhost:8025

  nats:
    image: nats:2.15-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "--auth", "yasaku-dev"]
    ports:
      - "4222:4222"
    volumes:
      - ./docker/data/nats:/data

  yasaku:
    build:
      context: .
      args:
        VERSION: dev
        COMMIT: local
        BUILD_TIME: unknown
    image: yasaku:dev
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      nats:
        condition: service_started
    ports:
      - "5150:5150"
    environment:
      YASAKU_MODE: selfhosted
      YASAKU_HTTP_ADDR: "0.0.0.0:5150"

      YASAKU_DB_DRIVER: postgres
      YASAKU_DB_DSN: "postgres://yasaku:yasaku@postgres:5432/yasaku?sslmode=disable"
      YASAKU_DB_ALLOW_BYPASS_RLS: "true"
      YASAKU_DB_AUTO_MIGRATE: "true"

      YASAKU_MAIL_DRIVER: smtp
      YASAKU_MAIL_FROM: "no-reply@yasaku.local"
      YASAKU_MAIL_SMTP_HOST: mailpit
      YASAKU_MAIL_SMTP_PORT: "1025"
      YASAKU_MAIL_SMTP_USER: ""
      YASAKU_MAIL_SMTP_PASS: ""
      YASAKU_MAIL_SMTP_TLS: "false"

      YASAKU_QUEUE_ENABLED: "true"
      YASAKU_QUEUE_URL: "nats://nats:4222"
      YASAKU_QUEUE_TOKEN: "yasaku-dev"

      YASAKU_GENESIS_EMAIL: admin@yasaku.local
      YASAKU_GENESIS_PASSWORD: change-me
    healthcheck:
      test: ["CMD", "/yasaku", "healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
